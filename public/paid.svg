<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <g transform="rotate(-15 80 80)">
    <!-- Outer Solid Green Circle (No corner designs/scallops, pure clean circle) -->
    <circle cx="80" cy="80" r="62" fill="#008a28" />
    
    <!-- White Circle Center -->
    <circle cx="80" cy="80" r="54" fill="#ffffff" />
    
    <!-- Middle Solid Green Circular Ring -->
    <circle cx="80" cy="80" r="48" fill="none" stroke="#008a28" stroke-width="2.5" />

    <!-- Inner Full 360-Degree Continuous Dotted Circle Ring -->
    <circle 
      cx="80" 
      cy="80" 
      r="42" 
      fill="none" 
      stroke="#008a28" 
      stroke-width="1.8" 
      stroke-dasharray="2,3" 
      stroke-linecap="round"
    />

    <!-- Bold Green PAID Text -->
    <text 
      x="80" 
      y="84" 
      text-anchor="middle" 
      fill="#008a28" 
      font-family="'Impact', 'Arial Black', sans-serif" 
      font-size="24" 
      font-weight="900" 
      letter-spacing="1.5"
    >
      PAID
    </text>

    <!-- Clean THANK YOU Text at Bottom -->
    <text 
      x="80" 
      y="102" 
      text-anchor="middle" 
      fill="#008a28" 
      font-family="'Arial', sans-serif" 
      font-size="7.5" 
      font-weight="800" 
      letter-spacing="1.8"
    >
      THANK YOU
    </text>
  </g>
</svg>